name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit

      # gitleaks-action requires a paid org license; run the container
      # image directly instead. --redact keeps any finding masked in logs.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact -v
